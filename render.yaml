services:
  - type: web
    name: chat-app-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1
      - key: BACKEND_URL
        sync: false
      - key: QUEUE_DRIVER
        value: bullmq
      - key: QUEUE_CONCURRENCY
        value: "5"
      - key: QUEUE_STRICT
        value: "false"
      - key: USE_MEMORY_REDIS
        value: "false"
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: LOG_LEVEL
        value: info
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: ALLOWED_FILE_TYPES
        value: jpeg,jpg,png,gif,pdf,doc,docx,txt,plain
      - key: UPLOAD_PATH
        value: /app/uploads
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
